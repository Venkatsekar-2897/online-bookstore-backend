spring.application.name=bookstore-backend
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/bookstore;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Keep request-driven pagination bounded to avoid unbounded result sets.
spring.data.web.pageable.max-page-size=100
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# OpenAPI endpoints
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# UI presentation
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persistAuthorization=false
# Application logs (set to DEBUG for detailed local troubleshooting).
logging.level.com.example.bookstore=INFO
